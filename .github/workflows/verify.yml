name: Verify UI Scaffold

on:
  pull_request:
  push:
    branches:
      - main
      - work
  workflow_dispatch:

concurrency:
  group: verify-ui-scaffold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: npm install, typecheck, and build
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: npm install
        run: npm install

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm run build
        run: npm run build

      - name: Verification summary
        if: success()
        run: |
          {
            echo "## Verification passed"
            echo ""
            echo "- npm install"
            echo "- npm run typecheck"
            echo "- npm run build"
          } >> "$GITHUB_STEP_SUMMARY"
